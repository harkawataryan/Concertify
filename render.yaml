# Render blueprint: one web service running the Dockerfile at the repo root,
# plus a free Key Value (Redis) instance so caches survive the free tier's
# spin-downs. RENDER_EXTERNAL_URL is injected by Render and used for the
# OAuth callback and frontend URL, so only the three API credentials need
# to be entered.
services:
  - type: web
    name: concertify
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_DASHBOARD_SP_DC
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: concertify-cache
          property: connectionString

  - type: keyvalue
    name: concertify-cache
    plan: free
    ipAllowList: [] # internal connections only
