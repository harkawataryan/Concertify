# Keeps the free Render instance awake (it sleeps after 15 idle minutes).
# GitHub drops most short-interval cron triggers, so instead of relying on a
# ping every 10 minutes this runs hourly and each run pings for 65 minutes.
# Consecutive runs overlap, so one skipped trigger changes nothing.
name: Keep alive

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive-${{ github.run_id }}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Ping /health every 4 minutes for 65 minutes
        run: |
          end=$((SECONDS + 65*60))
          fails=0
          while [ $SECONDS -lt $end ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://concertify-cm6k.onrender.com/health || echo 000)
            echo "$(date -u +%H:%M:%S) health $code"
            if [ "$code" != "200" ]; then fails=$((fails+1)); fi
            sleep 240
          done
          echo "non-200 responses: $fails"
          test "$fails" -lt 3
