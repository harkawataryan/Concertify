# Keeps the free Render instance awake (it sleeps after 15 idle minutes).
#
# GitHub's scheduler is unreliable for this: the hourly cron below has been
# firing only every 4 to 7 hours. So each run pings for just under the 6-hour
# job limit and then dispatches the next run itself, forming a continuous
# chain. The cron stays as a backstop that restarts the chain if it breaks.
# The fixed concurrency group means at most one run pings and one waits.
name: Keep alive

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Ping /health every 4 minutes for 5h50m
        run: |
          end=$((SECONDS + 350*60))
          fails=0
          while [ $SECONDS -lt $end ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://concertify-cm6k.onrender.com/health || echo 000)
            echo "$(date -u +%H:%M:%S) health $code"
            if [ "$code" != "200" ]; then fails=$((fails+1)); fi
            sleep 240
          done
          echo "non-200 responses: $fails"

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keepalive.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
